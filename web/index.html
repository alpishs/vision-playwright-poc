<!DOCTYPE html>
<html>

<head>
    <title>Vision AI Login POC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;

            padding: 10px;

            margin-top: 5px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 25px;

            cursor: pointer;
        }

        #result {
            margin-top: 20px;

            font-weight: bold;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Welcome Back</h2>

    <label for="username">
        Username
    </label>

    <input
        id="username"
        type="text"
        placeholder="Enter username"
    >

    <label for="password">
        Password
    </label>

    <input
        id="password"
        type="password"
        placeholder="Enter password"
    >

    <button
        onclick="login()"
    >
        Sign In
    </button>

    <div id="result"></div>

</div>


<script>

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const result =
        document.getElementById("result");


    // Empty username

    if (!username) {

        result.innerText =
            "Username is required";

        result.className =
            "error";

        return;
    }


    // Empty password

    if (!password) {

        result.innerText =
            "Password is required";

        result.className =
            "error";

        return;
    }


    // Valid credentials

    if (
        username === "alpish" &&
        password === "secret123"
    ) {

        result.innerText =
            "Login successful!";

        result.className =
            "success";

        return;
    }


    // Invalid credentials

    result.innerText =
        "Invalid username or password";

    result.className =
        "error";
}

</script>

</body>

</html>
